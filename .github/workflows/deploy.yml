# develop / main にpushされたらCIを実行し、Docker imageをGHCRへpushする
name: backend-ci-cd

# ************************
# 実行するタイミングを指定
# developとmainにpushされたときと、pull requestが作成されたとき
# ************************
on:
  push:
    branches:
      - develop
      - main

  pull_request:


# ************************
# 実行する処理の内容を書いている
# test → コードのチェック
# docker → Docker image作成
# ************************
jobs:
  test:
    name: Go Build and Test
    runs-on: ubuntu-latest

    # SQLの型推論はビルドやスタブでは検証できないため、実DBでテストする。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/pet_test?sslmode=disable

    steps:
      # リポジトリのコードを取得する
      - name: Checkout
        uses: actions/checkout@v4

      # Goを使えるようにする
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # go.mod / go.sum をもとに依存関係を取得
      - name: Download dependencies
        run: go mod download

      # Goアプリがビルドできるか確認
      - name: Build
        run: go build ./cmd/...

      - name: Unit and PostgreSQL integration tests
        run: go test -tags=integration ./...



# ************************
  # Docker imageを作成してGHCRにpushする処理を書いている
  # ************************
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    # push時だけDocker imageを作成push
    # pull_requestではimageをpushしない、
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      # リポジトリのコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Buildxを使えるようにする
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCRへログインする
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker imageをbuildしてGHCRへpush
      # developなら develop と コミットID
      # mainなら main と コミットID
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: prod
          tags: |
            ghcr.io/pasokatazip/backend:${{ github.ref_name }}
            ghcr.io/pasokatazip/backend:${{ github.sha }}
  

  update-k3s:
    name: Update k3s backend manifest
    runs-on: ubuntu-latest
    needs: docker

    # push時だけk3s repoを更新する
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      # k3s repoを取得する
      - name: Checkout k3s repo
        uses: actions/checkout@v4
        with:
          repository: pasokatazip/k3s
          ref: develop
          token: ${{ secrets.K3S_REPO_TOKEN }}
          path: k3s

      # backend Deploymentのimage tagを今回のcommit SHAに変更する
      - name: Update backend image tag
        run: |
          cd k3s
          sed -i "s|image: ghcr.io/pasokatazip/backend:.*|image: ghcr.io/pasokatazip/backend:${{ github.sha }}|" apps/backend/deployment.yaml
          sed -i "s|image: ghcr.io/pasokatazip/backend:.*|image: ghcr.io/pasokatazip/backend:${{ github.sha }}|" apps/backend/migrate-job.yaml
          sed -i "s|image: ghcr.io/pasokatazip/backend:.*|image: ghcr.io/pasokatazip/backend:${{ github.sha }}|" apps/backend/seed-job.yaml

      # k3s repoのdevelopへcommit/pushする
      - name: Commit and push
        run: |
          cd k3s
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apps/backend/deployment.yaml apps/backend/migrate-job.yaml apps/backend/seed-job.yaml
          git commit -m "deploy: update backend image to ${{ github.sha }}" || exit 0
          git push origin develop
