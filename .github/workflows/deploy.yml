# develop / main にpushされたらCIを実行し、Docker imageをGHCRへpushする
name: backend-ci-cd

# ************************
# 実行するタイミングを指定
# developとmainにpushされたときと、pull requestが作成されたとき
# ************************
on:
  push:
    branches:
      - develop
      - main

  pull_request:


# ************************
# 実行する処理の内容を書いている
# test → コードのチェック
# docker → Docker image作成
# ************************
jobs:
  test:
    name: Go Build
    runs-on: ubuntu-latest

    steps:
      # リポジトリのコードを取得する
      - name: Checkout
        uses: actions/checkout@v4

      # Goを使えるようにする
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # go.mod / go.sum をもとに依存関係を取得
      - name: Download dependencies
        run: go mod download

      # Goアプリがビルドできるか確認
      - name: Build
        run: go build ./cmd/server



# ************************
  # Docker imageを作成してGHCRにpushする処理を書いている
  # ************************
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    # push時だけDocker imageを作成push
    # pull_requestではimageをpushしない、
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      # リポジトリのコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Buildxを使えるようにする
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCRへログインする
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker imageをbuildしてGHCRへpush
      # developなら develop と コミットID
      # mainなら main と コミットID
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: prod
          tags: |
            ghcr.io/pasokatazip/backend:${{ github.ref_name }}
            ghcr.io/pasokatazip/backend:${{ github.sha }}