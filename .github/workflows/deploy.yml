# mainブランチにpushされたら、Go build確認後にDocker imageをGHCRへpushする
name: backend-ci-cd

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    name: Go Build
    runs-on: ubuntu-latest

    steps:
      # リポジトリのコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Go準備
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Go moduleの依存関係を取得
      - name: Download dependencies
        run: go mod download

      # Goのビルド確認
      - name: Build
        run: go build ./cmd/server

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    # mainブランチpush時だけGHCRへpush
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      # リポジトリのコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Buildxのセットアップ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Container Registryへログイン
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfileのprod stageをbuildしてGHCRへpush
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: prod
          tags: |
            ghcr.io/pasokatazip/backend:latest
            ghcr.io/pasokatazip/backend:${{ github.sha }}