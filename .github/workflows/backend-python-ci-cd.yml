name: backend-python-ci-cd

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "backend/python/**"
  pull_request:
    paths:
      - "backend/python/**"
  workflow_dispatch:

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend/python
          push: true
          tags: |
            ghcr.io/pasokatazip/backend-python:${{ github.ref_name }}
            ghcr.io/pasokatazip/backend-python:${{ github.sha }}

  update-k3s:
    name: Update k3s manifest
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout k3s repo
        uses: actions/checkout@v4
        with:
          repository: pasokatazip/k3s
          ref: develop
          token: ${{ secrets.K3S_REPO_TOKEN }}
          path: k3s

      - name: Update image tag
        run: |
          cd k3s
          sed -i "s|image: ghcr.io/pasokatazip/backend-python:.*|image: ghcr.io/pasokatazip/backend-python:${{ github.sha }}|" apps/backend-python/deployment.yaml

      - name: Commit and push
        run: |
          cd k3s
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apps/backend-python/deployment.yaml
          git commit -m "deploy: update backend-python image to ${{ github.sha }}" || exit 0
          git push origin develop