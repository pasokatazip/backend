  usecases.FindActivePetEvolutionHistoryOutput:
    properties:
      current_stage_id:
        type: integer
      evolutions:
        items:
          $ref: '#/definitions/usecases.PetGrowthEvolutionOutput'
        type: array
      pet_id:
        type: string
      stages:
        items:
          $ref: '#/definitions/usecases.ActivePetEvolutionStageOutput'
        type: array
    type: object
  usecases.FindByPetIDPostOutput:
    properties:
      content:
        type: string
      contentEmbedding:
        type: string
      createdAt:
        type: string
      id:
        type: string
      petID:
        type: string
    type: object
  usecases.FindByTodayReportOutput:
    properties:
      Group_name:
        type: string
      createdAt:
        type: string
      gossip:
        type: string
      hourSlot:
        type: integer
      id:
        type: string
      petID:
        type: string
      rumors:
        items:
          type: string
        type: array
    type: object
  usecases.FindCurrentPetEvolutionStatusOutput:
    properties:
      can_evolve:
        type: boolean
      current_stage:
        $ref: '#/definitions/usecases.CurrentPetEvolutionStageOutput'
      next_stages:
        items:
          $ref: '#/definitions/usecases.CurrentPetEvolutionCandidateOutput'
        type: array
      pet_id:
        type: string
    type: object
  usecases.FindPetGrowthRecordOutput:
    properties:
      color:
        type: string
      created_at:
        type: string
      current_stage_id:
        type: integer
      evolutions:
        items:
          $ref: '#/definitions/usecases.PetGrowthEvolutionOutput'
        type: array
      experience_events:
        items:
          $ref: '#/definitions/usecases.PetGrowthExperienceEventOutput'
        type: array
      feed_count:
        type: integer
      pet_id:
        type: string
      stages:
        items:
          $ref: '#/definitions/usecases.ActivePetEvolutionStageOutput'
        type: array
      total_experience:
        type: integer
    type: object
  usecases.PetGrowthEvolutionOutput:
    properties:
      created_at:
        type: string
      evolution_rule_id:
        type: integer
      evolved_at:
        type: string
      id:
        type: string
      primary_status:
        type: string
      stage_id:
        type: integer
    type: object
  usecases.PetGrowthExperienceEventOutput:
    properties:
      amount:
        type: integer
      capped_amount:
        type: integer
      created_at:
        type: string
      experience_date:
        type: string
      id:
        type: string
      source_id:
        type: string
      source_type:
        type: string
    type: object
  usecases.RunHourlyPetSimulationOutput:
    properties:
      interest_propagations:
        type: integer
      processed:
        type: integer
      reports_created:
        type: integer
      results:
        items:
          $ref: '#/definitions/usecases.RunHourlyPetSimulationPetResult'
        type: array
      simulated_at:
        type: string
      skipped:
        type: integer
      total_pets:
        type: integer
    type: object
  usecases.RunHourlyPetSimulationPetResult:
    properties:
      ambient_event:
        type: string
      move_probability:
        type: number
      moved:
        type: boolean
      next_group_master_id:
        type: integer
      pet_id:
        type: string
      previous_group_master_id:
        type: integer
    type: object
  usecases.UpdatePetDepartureStatusOutput:
    properties:
      departed_at:
        type: string
      eligible_at:
        type: string
      pet_id:
        type: string
      scheduled_departure_at:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: PETYO-YO backend API documentation
  title: PETYO-YO API
  version: "1.0"
paths:
  /notifications:
    get:
      description: 認証中のユーザーの通知設定を取得します。
      produces:
      - application/json
      responses:
        "200":
          description: 取得成功
          schema:
            $ref: '#/definitions/dto.NotificationResponse'
        "401":
          description: 認証が必要
          schema:
            type: string
        "404":
          description: 通知設定が見つからない
          schema:
            type: string
        "500":
          description: サーバーエラー
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 通知設定取得
      tags:
      - notifications
    post:
      consumes:
      - application/json
      description: 認証中のユーザーの通知設定と Web Push 購読情報を登録します。
      parameters:
      - description: 通知設定
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.NotificationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 登録成功
          schema:
            $ref: '#/definitions/dto.NotificationResponse'
        "400":
          description: リクエスト不正
          schema:
            type: string
        "401":
          description: 認証が必要
          schema:
            type: string
        "404":
          description: 対象が見つからない
          schema:
            type: string
        "500":
          description: サーバーエラー
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 通知設定登録
      tags:
      - notifications
    put:
      consumes:
      - application/json
      description: 認証中のユーザーの通知設定と Web Push 購読情報を更新します。
      parameters:
      - description: 通知設定
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateNotificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/dto.NotificationResponse'
        "400":
          description: リクエスト不正
          schema:
            type: string
        "401":
          description: 認証が必要
          schema:
            type: string
        "404":
          description: 通知設定が見つからない
          schema:
            type: string
        "500":
          description: サーバーエラー
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 通知設定更新
      tags:
      - notifications
  /pets:
    post:
      consumes:
      - application/json
      description: 認証中のユーザーに紐づくペットを作成します。
      parameters:
      - description: ペット情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 登録成功
          schema:
            $ref: '#/definitions/dto.CreatePetResponse'
        "400":
          description: リクエスト不正
          schema:
            type: string
        "401":
          description: 認証が必要
          schema:
            type: string
        "405":
          description: 許可されていないメソッド
          schema:
            type: string
        "500":
          description: サーバーエラー
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: ペット登録
      tags:
      - pets
  /pets/departure:
    patch:
      consumes:
      - application/json
      description: 自分のアクティブペットを eligible または departed に更新します。年齢、進化段階、旅立ち予定日を満たさない更新は拒否されます。
      parameters:
      - description: 旅立ち状態
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePetDepartureStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/usecases.UpdatePetDepartureStatusOutput'
        "400":
          description: 条件またはリクエスト不正
          schema:
            type: string
        "401":
          description: 認証が必要
          schema:
            type: string
        "404":
          description: アクティブペットが見つからない
          schema:
            type: string
        "500":
          description: サーバーエラー
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: ペットの旅立ち状態を更新
      tags:
      - pets
  /pets/evolution-status:
    get:
      description: 進化条件と進化先候補を確認します。このAPI自体は進化を実行しません。
      produces:
      - application/json
      responses:
        "200":
          description: 取得成功
          schema:
            $ref: '#/definitions/usecases.FindCurrentPetEvolutionStatusOutput'
        "400":
          description: ユーザーID不正
          schema:
            type: string
        "401":
          description: 認証が必要
          schema:
            type: string
        "500":
          description: サーバーエラー
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: アクティブペットの進化可能状態を取得
      tags:
      - pets
  /pets/evolutions:
    get:
      description: 認証中ユーザーの現在アクティブなペットに紐づく進化履歴を取得します。
      produces:
      - application/json
      responses:
        "200":
          description: 取得成功
          schema:
            $ref: '#/definitions/usecases.FindActivePetEvolutionHistoryOutput'
        "400":
          description: ユーザーID不正
          schema:
            type: string
        "401":
          description: 認証が必要
          schema:
            type: string
        "500":
          description: サーバーエラー
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: アクティブペットの進化履歴取得
      tags:
      - pets
  /pets/me:
    get:
      description: 認証中のユーザーのアクティブペット、現在の群れ、旅立ち状態を取得します。departure.can_depart が true
        の場合は旅立ち画面を表示できます。
      produces:
      - application/json
      responses:
        "200":
          description: 取得成功
          schema:
            $ref: '#/definitions/dto.CurrentPetResponse'
        "401":
          description: 認証が必要
          schema:
            type: string
        "404":
          description: アクティブペットが見つからない
          schema:
            type: string
        "405":
          description: 許可されていないメソッド
          schema:
            type: string
        "500":
          description: サーバーエラー
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 現在のペットと所属群れ取得
      tags:
      - pets
  /pets/me/souvenirs/latest:
    get:
      description: 認証中ユーザーのアクティブペットが最後に見つけたおみやげを取得します。未取得の場合はsouvenirがnullになります。
      produces:
      - application/json
      responses:
        "200":
          description: 取得成功
          schema:
            $ref: '#/definitions/dto.LatestPetSouvenirResponse'
        "400":
          description: ユーザーID不正
          schema:
            type: string
        "401":
          description: 認証が必要
          schema:
            type: string
        "404":
          description: アクティブペットが見つからない
          schema:
            type: string
        "500":
          description: サーバーエラー
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: アクティブペットの最新おみやげ取得
      tags:
      - pets
  /subsc/pets/{pet_id}/souvenirs/latest:
    get:
      description: 認証中ユーザーが所有する過去ペットが最後に見つけたおみやげを取得します。未取得の場合はsouvenirがnullになります。
      parameters:
      - description: 過去ペットID
        in: path
        name: pet_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 取得成功
          schema:
            $ref: '#/definitions/dto.LatestPetSouvenirResponse'
        "400":
          description: ユーザーIDまたはペットID不正
          schema:
            type: string
        "401":
          description: 認証が必要
          schema:
            type: string
        "403":
          description: サブスクリプションが必要
          schema:
            type: string
        "404":
          description: 過去ペットが見つからない
          schema:
            type: string
        "500":
          description: サーバーエラー
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 過去ペットの最後のおみやげ取得
      tags:
      - pets
  /posts:
    post:
      consumes:
      - application/json
      description: 指定したペットの投稿を作成します。
      parameters:
      - description: 投稿内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePostRequest'
      - description: ペットID
        in: query
        name: pet_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: 作成成功
          schema:
            $ref: '#/definitions/dto.CreatePostResponse'
        "400":
          description: リクエスト不正
          schema:
